<section id="tuning" class="broth card" hidden>
  <header>
    <h2>Tuning</h2>
    <button id="rest" class="ghost">Settle to rest</button>
  </header>
  <form id="feedback" hidden>
    <input id="feedback-text" placeholder="A note on what's playing, only for the cooks…" maxlength="2000"
      autocomplete="off" />
    <button>Note</button>
  </form>
  <div class="map">
    <header>
      <h3>Genre map</h3>
      <select id="jump" aria-label="Jump to a genre">
        <option value="">jump to…</option>
      </select>
      <button id="jump-now" class="ghost" disabled>Switch now</button>
    </header>
    <p id="map-where" class="mono"></p>
    <div id="map-sliders"></div>
  </div>
  <div class="map">
    <header>
      <h3>Track</h3>
      <button id="next-track" class="ghost">Next track</button>
    </header>
    <p id="form-where" class="mono"></p>
    <p id="track-next" class="mono"></p>
    <p id="palette-where" class="mono"></p>
  </div>
  <label class="key">
    Time travel
    <select id="travel">
      <option value="0">now</option>
      <option value="5">in 5 hours</option>
      <option value="10">in 10 hours</option>
      <option value="24">tomorrow</option>
      <option value="48">the day after tomorrow</option>
      <option value="168">in a week</option>
      <option value="336">in two weeks</option>
      <option value="504">in three weeks</option>
      <option value="1080">in six weeks</option>
    </select>
  </label>
  <label class="key" id="pretend-row" hidden>
    Weather
    <select id="pretend">
      <option value="">its own</option>
    </select>
  </label>
  <label class="key">
    Key
    <select id="key">
      <option>C</option>
      <option>D</option>
      <option>E</option>
      <option>F</option>
      <option>G</option>
      <option>A</option>
      <option>Bb</option>
    </select>
  </label>
  <div class="map">
    <header>
      <h3>Broth</h3>
    </header>
    <div id="sliders"></div>
  </div>
  <details>
    <summary>Course code</summary>
    <textarea id="code" spellcheck="false"></textarea>
    <div class="row">
      <button id="play-code">Propose to the room</button>
      <button id="play-stone" class="ghost">Back to the stone</button>
      <button id="cook" class="ghost">Ask the live coder</button>
    </div>
  </details>
  <p id="status" class="mono"></p>
</section>

<section id="layers-panel" class="layers card" hidden>
  <header>
    <h2>Layers</h2>
    <button id="layers-all" class="ghost">All on</button>
  </header>
  <p class="mono">Only you hear this. Click a layer to mute it, shift-click to hear it alone. A dot
    means it played in the last two seconds.</p>
  <ul id="layers"></ul>
</section>
